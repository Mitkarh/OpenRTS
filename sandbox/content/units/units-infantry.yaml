      [
        {
          Channel: optical,
          Signature: visual,
          Range: 3072,
          Display: Model,
          Counters: [stealth],
        },
      ]
  Inherits: ^unit
  Passenger: { Type: infantry }
  Armaments:
    Mounts:
      main: { Weapon: rifleman, FireFromTransport: true }
