Match:
  DefaultMap: content/maps/skirmish.yaml
  DefaultStartSet: content/start-sets/supply.yaml
  AiConfig: content/ai/skirmish-ai.yaml
  AiProfile: infantry-skirmish
  Maps:
    - Path: content/maps/skirmish.yaml
      Title: Долина
      Description: Открытая долина с дорогами, озером и четырьмя месторождениями.
    - Path: content/maps/crossroads.yaml
      Title: Перекрёсток
      Description: Городские кварталы и вокзал у пересечения дорог.
    - Path: content/maps/riverside-station.yaml
      Title: Береговая станция
      Description: Два посёлка разделены рекой. Дороги сходятся к двум переправам.
    - Path: content/scene-maps/terrain-authoring-sample.scenemap.json
      Title: Учебная карта Godot
      Description: Карта со сценой Godot, дорожными кистями и нейтральным заводом.
    - Path: content/scene-maps/initial-properties-sample.scenemap.json
      Title: Начальные свойства
      Description: Раненый боец, ветеран и повёрнутая электростанция.
  StartingSets:
    - Path: content/start-sets/supply.yaml
      Title: Снабжение · центр, инженер и грузовик
    - Path: content/start-sets/infantry.yaml
      Title: Пехотный старт · площадка и два бойца
